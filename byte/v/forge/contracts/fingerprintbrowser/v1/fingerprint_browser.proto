syntax = "proto3";

package byte.v.forge.contracts.fingerprintbrowser.v1;

import "byte/v/forge/contracts/common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

enum BrowserKind {
  BROWSER_KIND_UNSPECIFIED = 0;
  BROWSER_KIND_CHROMIUM = 1;
  BROWSER_KIND_FIREFOX = 2;
  BROWSER_KIND_WEBKIT = 3;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_STARTING = 1;
  SESSION_STATUS_RUNNING = 2;
  SESSION_STATUS_STOPPED = 3;
  SESSION_STATUS_FAILED = 4;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_QUEUED = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SUCCEEDED = 3;
  TASK_STATUS_FAILED = 4;
  TASK_STATUS_TIMEOUT = 5;
}

message Viewport {
  uint32 width = 1;
  uint32 height = 2;
}

message BrowserFingerprint {
  string user_agent = 1;
  string accept_language = 2;
  string timezone = 3;
  string locale = 4;
  Viewport viewport = 5;
}

message BrowserProfile {
  BrowserKind browser_kind = 1;
  BrowserFingerprint fingerprint = 2;
  // proxy_lease_uid references a ProxyLease in proxyruntime.v1.
  string proxy_lease_uid = 3;
}

// BrowserSession is a long-running fingerprinted browser instance running on
// a remote host.
message BrowserSession {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  SessionStatus status = 2;
  BrowserProfile profile = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp expire_time = 5;
}

message NavigateCommand {
  string url = 1;
}

message ClickCommand {
  string selector = 1;
}

message FillCommand {
  string selector = 1;
  string value = 2;
}

message EvaluateCommand {
  string script = 1;
}

message ScreenshotCommand {
  bool full_page = 1;
}

message WaitCommand {
  string selector = 1;
  uint32 timeout_ms = 2;
}

message BrowserCommand {
  oneof kind {
    NavigateCommand navigate = 1;
    ClickCommand click = 2;
    FillCommand fill = 3;
    EvaluateCommand evaluate = 4;
    ScreenshotCommand screenshot = 5;
    WaitCommand wait = 6;
  }
}

// BrowserTask is a sequence of commands executed against a BrowserSession.
message BrowserTask {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  // session_uid references the owning BrowserSession.
  string session_uid = 2;
  TaskStatus status = 3;
  repeated BrowserCommand commands = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp finish_time = 6;
  // error is populated when status = TASK_STATUS_FAILED.
  google.rpc.Status error = 7;
}

message TaskStatusChanged {
  TaskStatus status = 1;
  google.protobuf.Timestamp change_time = 2;
}

message TaskArtifactProduced {
  byte.v.forge.contracts.common.v1.ArtifactRef artifact = 1;
}

// LiveViewSession is a short-lived browser viewer for human supervision.
message LiveViewSession {
  string url = 1;
  google.protobuf.Timestamp expire_time = 2;
}

message CreateSessionRequest {
  BrowserProfile profile = 1;
}

message CreateSessionResponse {
  BrowserSession session = 1;
}

message GetSessionRequest {
  string uid = 1;
}

message GetSessionResponse {
  BrowserSession session = 1;
}

message StopSessionRequest {
  string uid = 1;
}

message StopSessionResponse {
  BrowserSession session = 1;
}

message CreateTaskRequest {
  // session_uid references the BrowserSession to execute against.
  string session_uid = 1;
  repeated BrowserCommand commands = 2;
}

message CreateTaskResponse {
  BrowserTask task = 1;
}

message GetTaskRequest {
  string uid = 1;
}

message GetTaskResponse {
  BrowserTask task = 1;
}

message StreamTaskEventsRequest {
  // task_uid references the BrowserTask to stream events for.
  string task_uid = 1;
}

message StreamTaskEventsResponse {
  string task_uid = 1;
  oneof kind {
    TaskStatusChanged status_changed = 2;
    TaskArtifactProduced artifact = 3;
  }
}

message CreateLiveViewRequest {
  // session_uid references the BrowserSession to attach the view to.
  string session_uid = 1;
}

message CreateLiveViewResponse {
  LiveViewSession live_view = 1;
}

service FingerprintBrowserService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc StreamTaskEvents(StreamTaskEventsRequest) returns (stream StreamTaskEventsResponse);
  rpc CreateLiveView(CreateLiveViewRequest) returns (CreateLiveViewResponse);
}
