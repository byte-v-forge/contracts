syntax = "proto3";

package byte.v.forge.contracts.proxyruntime.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

enum ProxyProtocol {
  PROXY_PROTOCOL_UNSPECIFIED = 0;
  PROXY_PROTOCOL_HTTP = 1;
  PROXY_PROTOCOL_SOCKS5 = 2;
}

enum LeaseStatus {
  LEASE_STATUS_UNSPECIFIED = 0;
  LEASE_STATUS_ACTIVE = 1;
  LEASE_STATUS_EXPIRED = 2;
  LEASE_STATUS_RELEASED = 3;
  LEASE_STATUS_FAILED = 4;
}

enum ExitRiskLevel {
  EXIT_RISK_LEVEL_UNSPECIFIED = 0;
  EXIT_RISK_LEVEL_LOW = 1;
  EXIT_RISK_LEVEL_MEDIUM = 2;
  EXIT_RISK_LEVEL_HIGH = 3;
  EXIT_RISK_LEVEL_UNKNOWN = 4;
}

message LeasePolicy {
  // country_code is the requested egress country (ISO 3166-1 alpha-2).
  string country_code = 1;
  string region = 2;
  google.protobuf.Duration sticky_ttl = 3;
}

// ProxyEndpoint exposes only the connection coordinates. Credentials are
// fetched via GetLeaseCredentials.
message ProxyEndpoint {
  ProxyProtocol protocol = 1;
  string host = 2;
  uint32 port = 3;
}

// ProxyCredentials carries short-lived credentials for a lease's endpoint.
message ProxyCredentials {
  string username = 1;
  string password = 2;
  google.protobuf.Timestamp expire_time = 3;
}

message ExitInfo {
  string ip = 1;
  // country_code is the observed egress country (ISO 3166-1 alpha-2).
  string country_code = 2;
  string region = 3;
  string city = 4;
}

message ExitRisk {
  ExitRiskLevel level = 1;
  double score = 2;
  google.protobuf.Timestamp check_time = 3;
}

// ProxyLease is an active or terminal proxy reservation owned by a caller.
message ProxyLease {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  // purpose is the caller-supplied lease label, free-form.
  string purpose = 2;
  LeaseStatus status = 3;
  ProxyEndpoint endpoint = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp expire_time = 6;
  // error is populated when status = LEASE_STATUS_FAILED.
  google.rpc.Status error = 7;
}

message ExitCheckSnapshot {
  // lease_uid is the ProxyLease.uid the snapshot belongs to.
  string lease_uid = 1;
  ExitInfo exit = 2;
  ExitRisk risk = 3;
  google.protobuf.Timestamp update_time = 4;
}

message GatewayStatus {
  bool ready = 1;
  string version = 2;
}

message AcquireLeaseRequest {
  string purpose = 1;
  LeasePolicy policy = 2;
}

message AcquireLeaseResponse {
  ProxyLease lease = 1;
}

message ReleaseLeaseRequest {
  // uid identifies the ProxyLease to release.
  string uid = 1;
}

message ReleaseLeaseResponse {
  ProxyLease lease = 1;
}

message GetLeaseRequest {
  string uid = 1;
}

message GetLeaseResponse {
  ProxyLease lease = 1;
}

message GetLeaseCredentialsRequest {
  // uid identifies the ProxyLease whose credentials are requested.
  string uid = 1;
}

message GetLeaseCredentialsResponse {
  ProxyCredentials credentials = 1;
}

message GetExitCheckRequest {
  // uid identifies the ProxyLease whose exit check is requested.
  string uid = 1;
}

message GetExitCheckResponse {
  ExitCheckSnapshot snapshot = 1;
}

message GetGatewayStatusRequest {}

message GetGatewayStatusResponse {
  GatewayStatus status = 1;
}

service ProxyGatewayService {
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse);
  rpc GetLeaseCredentials(GetLeaseCredentialsRequest) returns (GetLeaseCredentialsResponse);
  rpc GetExitCheck(GetExitCheckRequest) returns (GetExitCheckResponse);
  rpc GetGatewayStatus(GetGatewayStatusRequest) returns (GetGatewayStatusResponse);
}
