syntax = "proto3";

package byte.v.forge.contracts.common.v1;

import "google/protobuf/timestamp.proto";

message SecretRef {
  string id = 1;
  string provider = 2;
  string purpose = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ArtifactRef {
  string id = 1;
  string uri = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string purpose = 5;
  google.protobuf.Timestamp expires_at = 6;
}
