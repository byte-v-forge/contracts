syntax = "proto3";

package byte.v.forge.contracts.account.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_SUSPENDED = 2;
  ACCOUNT_STATUS_ARCHIVED = 3;
}

enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_PASSWORD = 1;
  CREDENTIAL_KIND_OAUTH = 2;
  CREDENTIAL_KIND_COOKIE = 3;
  CREDENTIAL_KIND_PASSKEY = 4;
}

enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_EXPIRED = 2;
  CREDENTIAL_STATUS_REVOKED = 3;
  CREDENTIAL_STATUS_MISSING = 4;
}

// PersonalName groups the principal's name components, mirroring SCIM 2.0
// User.name.
message PersonalName {
  // display_name is a human-readable label, no uniqueness requirement.
  string display_name = 1;
  // given_name is the principal's given name (AIP-148; do not use first_name).
  string given_name = 2;
  // family_name is the principal's family name (AIP-148; do not use last_name).
  string family_name = 3;
}

// ContactInfo groups the principal's canonical contact channels. Per-channel
// verification state lives on the corresponding LinkedIdentity.
message ContactInfo {
  // primary_email is the canonical contact email.
  string primary_email = 1;
  // primary_phone is the canonical contact phone in E.164 format.
  string primary_phone = 2;
}

// Profile groups display and localization preferences attached to an
// Account. Mirrors OIDC standard claims (picture/locale/zoneinfo).
message Profile {
  // avatar_uri points to a profile picture, free-form URI.
  string avatar_uri = 1;
  // locale is a BCP-47 language tag (e.g. "en-US").
  string locale = 2;
  // time_zone is an IANA time zone name (e.g. "Asia/Shanghai").
  string time_zone = 3;
}

// CredentialState exposes the status of a credential without returning the
// credential value itself. Sensitive material must be redeemed via a
// separate short-lived RPC.
message CredentialState {
  CredentialKind kind = 1;
  CredentialStatus status = 2;
  google.protobuf.Timestamp expire_time = 3;
}

// ProviderRef points to a federated identity on an external provider.
message ProviderRef {
  // provider identifies the upstream identity provider (e.g. "facebook",
  // "google", "twitter", "phone", "password").
  string provider = 1;
  // subject is the principal's stable identifier on the provider
  // (SCIM externalId / OIDC sub).
  string subject = 2;
}

// VerifiedContact is a contact snapshot from a provider with its verification
// flags.
message VerifiedContact {
  // email is the provider-side email address, free-form.
  string email = 1;
  // email_verified is true when the provider has verified email ownership.
  bool email_verified = 2;
  // phone is the provider-side phone number in E.164 format.
  string phone = 3;
  // phone_verified is true when the provider has verified phone ownership.
  bool phone_verified = 4;
}

// Account is a unified principal tracked by the system. Federation to
// external identity providers is modeled separately via LinkedIdentity,
// allowing one Account to bind multiple providers (SCIM 2.0 / Auth0 style).
message Account {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  PersonalName name = 2;
  ContactInfo contact = 3;
  Profile profile = 4;
  AccountStatus status = 5;
  map<string, string> labels = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}

// LinkedIdentity is a federated identity provider binding for an Account.
// An Account can have any number of LinkedIdentity records (one per
// provider account).
message LinkedIdentity {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  // account_uid references the Account this identity is bound to.
  string account_uid = 2;
  ProviderRef provider_ref = 3;
  // display_name is the provider-side display name, free-form.
  string display_name = 4;
  VerifiedContact contact = 5;
  CredentialState credential = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}

message CreateAccountRequest {
  PersonalName name = 1;
  ContactInfo contact = 2;
  Profile profile = 3;
  map<string, string> labels = 4;
}

message CreateAccountResponse {
  Account account = 1;
}

message GetAccountRequest {
  string uid = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message ListAccountsRequest {
  // filter follows AIP-160 expression syntax over Account fields
  // (e.g. "status = ACTIVE AND profile.locale = 'en-US'").
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

message UpdateAccountRequest {
  // account carries the new field values; only fields listed in update_mask
  // are applied. account.uid identifies the resource (AIP-134).
  Account account = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateAccountResponse {
  Account account = 1;
}

message DeleteAccountRequest {
  string uid = 1;
}

message DeleteAccountResponse {}

service AccountService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

message LinkIdentityRequest {
  // account_uid references the Account to attach the new identity to.
  string account_uid = 1;
  ProviderRef provider_ref = 2;
  string display_name = 3;
  VerifiedContact contact = 4;
}

message LinkIdentityResponse {
  LinkedIdentity identity = 1;
}

message UnlinkIdentityRequest {
  // uid identifies the LinkedIdentity to remove.
  string uid = 1;
}

message UnlinkIdentityResponse {}

message GetLinkedIdentityRequest {
  string uid = 1;
}

message GetLinkedIdentityResponse {
  LinkedIdentity identity = 1;
}

message ListLinkedIdentitiesRequest {
  // account_uid references the Account whose identities are listed.
  string account_uid = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListLinkedIdentitiesResponse {
  repeated LinkedIdentity identities = 1;
  string next_page_token = 2;
}

service LinkedIdentityService {
  rpc LinkIdentity(LinkIdentityRequest) returns (LinkIdentityResponse);
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
  rpc GetLinkedIdentity(GetLinkedIdentityRequest) returns (GetLinkedIdentityResponse);
  rpc ListLinkedIdentities(ListLinkedIdentitiesRequest) returns (ListLinkedIdentitiesResponse);
}
