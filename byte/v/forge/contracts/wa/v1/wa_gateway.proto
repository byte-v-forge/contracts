syntax = "proto3";

package byte.v.forge.contracts.wa.v1;

import "google/protobuf/timestamp.proto";

enum WaAccountStatus {
  WA_ACCOUNT_STATUS_UNSPECIFIED = 0;
  WA_ACCOUNT_STATUS_REGISTERING = 1;
  WA_ACCOUNT_STATUS_ACTIVE = 2;
  WA_ACCOUNT_STATUS_BANNED = 3;
  WA_ACCOUNT_STATUS_ARCHIVED = 4;
}

// WaAccount is a WhatsApp account managed by the gateway.
message WaAccount {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  // phone is the account's number in E.164 format.
  string phone = 2;
  WaAccountStatus status = 3;
  google.protobuf.Timestamp create_time = 4;
}

// OutgoingMessage is a message dispatched from a managed WaAccount.
message OutgoingMessage {
  // account_uid references the WaAccount sending the message.
  string account_uid = 1;
  // to_phone is the recipient number in E.164 format.
  string to_phone = 2;
  string text = 3;
}

// IncomingMessage is a message received on a managed WaAccount.
message IncomingMessage {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  // account_uid references the WaAccount receiving the message.
  string account_uid = 2;
  // from_phone is the sender number in E.164 format.
  string from_phone = 3;
  string text = 4;
  google.protobuf.Timestamp receive_time = 5;
}

message CreateAccountRequest {
  // phone_e164 is the account number to register; must be E.164.
  string phone_e164 = 1;
}

message CreateAccountResponse {
  WaAccount account = 1;
}

message GetAccountRequest {
  string uid = 1;
}

message GetAccountResponse {
  WaAccount account = 1;
}

message DeleteAccountRequest {
  string uid = 1;
}

message DeleteAccountResponse {}

message CompleteRegistrationRequest {
  // uid identifies the WaAccount finalizing registration.
  string uid = 1;
  string otp_code = 2;
}

message CompleteRegistrationResponse {
  WaAccount account = 1;
}

message SendMessageRequest {
  OutgoingMessage message = 1;
}

message SendMessageResponse {
  // message_uid is the system-assigned identifier of the dispatched message.
  string message_uid = 1;
  google.protobuf.Timestamp send_time = 2;
}

message StreamMessagesRequest {
  // account_uid references the WaAccount whose inbound stream is consumed.
  string account_uid = 1;
}

message StreamMessagesResponse {
  IncomingMessage message = 1;
}

service WaSessionService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc CompleteRegistration(CompleteRegistrationRequest) returns (CompleteRegistrationResponse);
}

service WaMessagingService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc StreamMessages(StreamMessagesRequest) returns (stream StreamMessagesResponse);
}
