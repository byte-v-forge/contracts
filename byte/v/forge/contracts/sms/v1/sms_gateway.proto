syntax = "proto3";

package byte.v.forge.contracts.sms.v1;

import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "google/type/money.proto";

enum SmsOrderStatus {
  SMS_ORDER_STATUS_UNSPECIFIED = 0;
  SMS_ORDER_STATUS_PENDING = 1;
  SMS_ORDER_STATUS_ACTIVE = 2;
  SMS_ORDER_STATUS_COMPLETED = 3;
  SMS_ORDER_STATUS_EXPIRED = 4;
  SMS_ORDER_STATUS_CANCELLED = 5;
  SMS_ORDER_STATUS_FAILED = 6;
}

// SmsTarget identifies the destination application and country for an SMS
// number purchase.
message SmsTarget {
  // application_key is the stable catalog key (e.g. "telegram", "whatsapp").
  string application_key = 1;
  // country_code is the requested country (ISO 3166-1 alpha-2).
  string country_code = 2;
}

message PhoneNumber {
  // e164 is the canonical E.164 representation, including leading "+".
  string e164 = 1;
  // country_code is the number's country (ISO 3166-1 alpha-2).
  string country_code = 2;
  // calling_code is the country calling code without the "+" prefix.
  string calling_code = 3;
}

// SmsOrder is a purchase reserving a phone number for receiving SMS codes.
message SmsOrder {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  SmsOrderStatus status = 2;
  SmsTarget target = 3;
  PhoneNumber number = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp expire_time = 6;
  // error is populated when status = SMS_ORDER_STATUS_FAILED.
  google.rpc.Status error = 7;
}

// SmsCode is a verification code observed on a reserved number.
message SmsCode {
  // order_uid references the owning SmsOrder.
  string order_uid = 1;
  string code = 2;
  google.protobuf.Timestamp receive_time = 3;
}

// SmsOffer is a catalog entry from a specific provider for a target.
message SmsOffer {
  // uid is the system-assigned short opaque identifier (nanoid). Output only.
  string uid = 1;
  SmsTarget target = 2;
  // provider identifies the upstream SMS provider.
  string provider = 3;
  // price is the per-order price quoted by the provider.
  google.type.Money price = 4;
  uint32 stock = 5;
}

// SmsApplication is a catalog descriptor for an application receivable on
// the SMS gateway.
message SmsApplication {
  // key is the stable catalog key (e.g. "telegram", "whatsapp").
  string key = 1;
  string display_name = 2;
}

message AcquireNumberRequest {
  SmsTarget target = 1;
  // offer_uid selects a specific provider offer.
  string offer_uid = 2;
}

message AcquireNumberResponse {
  SmsOrder order = 1;
}

message ReleaseNumberRequest {
  // uid identifies the SmsOrder to release.
  string uid = 1;
}

message ReleaseNumberResponse {
  SmsOrder order = 1;
}

message GetOrderRequest {
  string uid = 1;
}

message GetOrderResponse {
  SmsOrder order = 1;
}

message ListOffersRequest {
  SmsTarget target = 1;
}

message ListOffersResponse {
  repeated SmsOffer offers = 1;
}

message ListApplicationsRequest {}

message ListApplicationsResponse {
  repeated SmsApplication applications = 1;
}

message StreamCodesRequest {
  // order_uid references the SmsOrder to stream codes for.
  string order_uid = 1;
}

message StreamCodesResponse {
  SmsCode code = 1;
}

service SmsGatewayService {
  rpc AcquireNumber(AcquireNumberRequest) returns (AcquireNumberResponse);
  rpc ReleaseNumber(ReleaseNumberRequest) returns (ReleaseNumberResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  rpc StreamCodes(StreamCodesRequest) returns (stream StreamCodesResponse);
}
